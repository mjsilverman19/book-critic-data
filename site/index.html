<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Critic Data</title>
<style>
:root { --fg: #111; --dim: #6b6b6b; --soft: #444; --line: #e6e6e6; --bg: #fff; --off: #b0b0b0;
  --rave: #111; --pos: #6b6b6b; --mix: #b8b8b8; --pan: #e2e2e2; --pan-edge: #cfcfcf; --fill: #f2f2f2; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8e8e8; --dim: #8f8f8f; --soft: #bdbdbd; --line: #262626; --bg: #111; --off: #555;
  --rave: #ececec; --pos: #a3a3a3; --mix: #616161; --pan: #333; --pan-edge: #4a4a4a; --fill: #1d1d1d; } }
* { box-sizing: border-box; }
html { background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0 auto; max-width: 1440px; padding: 32px 24px 96px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
nav { display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; margin-bottom: 24px; }
nav a { color: var(--dim); }
nav a.on { color: var(--fg); }
nav a.brand { color: var(--fg); font-weight: 600; margin-right: 12px; }
nav .n { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap; border-bottom: 1px solid var(--fg); }
input, select { font: inherit; color: inherit; background: none; border: 0; outline: 0; padding: 6px 0; margin: 0; }
select { color: var(--dim); cursor: pointer; }
select { field-sizing: content; max-width: 220px; }
select.set { color: var(--fg); }
select:hover { color: var(--fg); }
#q { flex: 1; min-width: 160px; }
#min { width: 2.5em; text-align: right; -moz-appearance: textfield; }
#min::-webkit-inner-spin-button, #min::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.bar label { color: var(--dim); white-space: nowrap; }
.chips { display: flex; gap: 16px; flex-wrap: wrap; min-height: 8px; padding: 8px 0 0; color: var(--dim); }
.chips:empty { padding: 0; }
.chips a b { font-weight: normal; color: var(--fg); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; }
th { font-weight: normal; color: var(--dim); text-align: left; padding: 6px 12px 6px 0; cursor: pointer; user-select: none; white-space: nowrap; }
th.on { color: var(--fg); }
th[title] { text-decoration: underline dotted var(--line); text-underline-offset: 4px; }
td { padding: 5px 12px 5px 0; border-top: 1px solid var(--line); vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
.r { text-align: right; white-space: nowrap; }
.nw { white-space: nowrap; }
.f { cursor: pointer; }
.f:hover { text-decoration: underline; }
.scroll { overflow-x: auto; }
.d { color: var(--dim); }
.sub, .m-only { display: none; }
h1 { font-size: 20px; font-weight: normal; margin: 0 0 2px; }
.meta { color: var(--dim); margin-bottom: 16px; }
.meta a:hover { color: var(--fg); }
.desc { max-width: 640px; margin: 0 0 32px; }
.rev { padding: 12px 0; border-top: 1px solid var(--line); }
.rev .h { color: var(--dim); }
.rev .h b { font-weight: normal; color: var(--fg); }
.rev p { margin: 4px 0 0; max-width: 680px; }
.status { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 0 0; color: var(--dim); font-variant-numeric: tabular-nums; }
.status b, .pager b { font-weight: normal; color: var(--fg); }
.pager { border-top: 1px solid var(--fg); margin-top: 8px; padding-top: 16px; display: flex; flex-wrap: wrap; gap: 12px 16px;
  align-items: center; justify-content: space-between; font-variant-numeric: tabular-nums; }
.pager .pages { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.pager button { font: inherit; color: var(--fg); background: none; border: 0; border-radius: 2px; cursor: pointer;
  min-width: 36px; min-height: 36px; padding: 0 8px; }
.pager button:hover:not(:disabled):not(.cur) { text-decoration: underline; }
.pager button.cur { background: var(--fg); color: var(--bg); cursor: default; }
.pager button:disabled { color: var(--off); cursor: default; }
.pager .gap { min-width: 24px; text-align: center; color: var(--dim); }
.pager .mpage { display: none; align-items: center; gap: 6px; color: var(--dim); }
.pager .mpage input { width: 3.5em; text-align: center; color: var(--fg); border: 1px solid var(--pan-edge); border-radius: 2px; padding: 6px 2px;
  -moz-appearance: textfield; }
.pager .mpage input::-webkit-inner-spin-button, .pager .mpage input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.pager .per { color: var(--dim); }
.pager .per select { color: var(--fg); margin-left: 6px; }
.dist { display: flex; height: 6px; gap: 1px; }

.s4 { background: var(--rave); } .s3 { background: var(--pos); } .s2 { background: var(--mix); } .s1 { background: var(--pan); }
#home { padding-top: 48px; }
#home .hero { max-width: 760px; margin-bottom: 64px; }
#home h1 { font-size: 44px; line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 18px; }
#home .lede { font-size: 18px; color: var(--soft); margin: 0 0 32px; max-width: 640px; }
#home label.lab { display: block; font-size: 12px; color: var(--dim); margin-bottom: 2px; }
#home .search { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--fg); }
#home .search svg { flex: none; }
#home .search input { flex: 1; min-width: 0; font-size: 20px; padding: 12px 0; }
#home .try { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 12px; color: var(--dim); }
#home .try a { color: var(--fg); }
#hits { margin-top: 4px; }
#hits:empty { display: none; }
#hits .grp { padding: 10px 0 4px; color: var(--dim); font-size: 12px; }
#hits a { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--line); }
#hits a span { color: var(--dim); white-space: nowrap; }

  border-bottom: 1px solid var(--fg); padding-bottom: 8px; margin-bottom: 20px; }

#home .sh .d a { color: var(--fg); }
.covers { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 28px 20px; }
.covers a { display: block; }
.covers a:hover { text-decoration: none; }

.covers .img { display: block; width: 100%; aspect-ratio: 2 / 3; background: var(--fill); border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
.covers img { display: block; width: 100%; height: 100%; object-fit: cover; }
.covers .t { font-weight: 500; line-height: 1.3; }
.covers .a { color: var(--dim); line-height: 1.3; margin-bottom: 8px; }
.covers .dist { margin-bottom: 6px; }
.covers .v { font-size: 13px; color: var(--dim); }
.covers .v b { font-weight: normal; color: var(--fg); text-transform: capitalize; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; font-size: 12px; color: var(--dim); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; }
.legend .s1 { box-shadow: inset 0 0 0 1px var(--pan-edge); }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 48px; }
#home .lists section { margin: 0; }
#home .lists .sh { display: block; margin-bottom: 4px; }
#home .lists .sub { display: block; color: var(--dim); font-size: 13px; }
#home .lists .sub a { color: var(--fg); }
.rank { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rank:hover { text-decoration: none; }
.rank:hover .t { text-decoration: underline; }
.rank .i { color: var(--dim); font-variant-numeric: tabular-nums; }
.rank .t { display: block; font-weight: 500; line-height: 1.3; }
.rank .a { display: block; color: var(--dim); line-height: 1.3; margin-bottom: 7px; }
.rank .dist { height: 5px; max-width: 180px; }
.rank .st { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rank .st span { display: block; color: var(--dim); font-size: 12px; }
.lists .all { display: inline-flex; align-items: center; min-height: 44px; }
.cta { border-top: 1px solid var(--fg); padding-top: 32px; display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: flex-start; justify-content: space-between; }
#home .cta h2.big { font-size: 24px; font-weight: normal; letter-spacing: -0.01em; margin: 0 0 10px; }
.cta p { font-size: 16px; color: var(--soft); margin: 0; max-width: 620px; }
a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 22px; background: var(--fg); color: var(--bg); border-radius: 2px; }
a.btn:hover { text-decoration: none; opacity: .85; }
h2.sec.first { margin-top: 24px; }
.starter { columns: 2 420px; column-gap: 48px; margin-bottom: 40px; }
.starter > div { break-inside: avoid; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 6px 0; border-top: 1px solid var(--line); }
.starter select { flex: none; }
.empty { color: var(--dim); padding: 24px 0; }
.empty a { color: var(--fg); }
button.tx { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
button.tx:hover { color: var(--fg); text-decoration: underline; }
button.tx.on { color: var(--fg); }
h2.sec { font: inherit; margin: 56px 0 2px; }
.plain th { cursor: default; }
#rate { padding: 0; }
button.more { margin-top: 12px; color: var(--dim); }
body.book-page { display: grid; grid-template-columns: minmax(0, 680px) 160px; column-gap: 48px; }
.book-page nav { grid-column: 1 / -1; }
.book-page #head, .book-page #out { grid-column: 1; }
.book-page #head { grid-row: 2; }
.book-page #out { grid-row: 3; }
#book-cover[hidden] { display: none; }
#book-cover { grid-column: 2; grid-row: 2 / 4; align-self: start; position: sticky; top: 32px; }
#book-cover img { display: block; width: 100%; height: auto; max-height: 250px; object-fit: contain;
  object-position: top center; border-radius: 3px; }
#book-cover button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
#book-cover button:focus-visible { outline: 2px solid var(--fg); outline-offset: 5px; }
html.cover-open { overflow: hidden; }
#cover-dialog { padding: 0; border: 0; background: transparent; max-width: 100vw; max-height: 100dvh; overflow: auto; outline: none; cursor: zoom-out; }
#cover-dialog::backdrop { background: #fff; }
#cover-dialog img { display: block; width: auto; height: auto; max-width: min(80vw, 640px); max-height: 80dvh; margin: auto; }
@media (max-width: 900px) {
  body.book-page { grid-template-columns: minmax(0, 1fr) 160px; column-gap: 32px; }
}
@media (max-width: 640px) {
  body.book-page { display: block; }
  #book-cover { position: static; width: 140px; margin: 0 0 28px; }
  body { padding: 24px 16px 96px; font-size: 13px; }
  th, td { padding-right: 10px; }
  td { white-space: nowrap; }
  .sub { display: block; color: var(--dim); }
  .desk, .md { display: none; }
  td:first-child { min-width: 150px; white-space: normal; }
  td.list { min-width: 240px; white-space: normal; }
  th:first-child, td:first-child { position: sticky; left: 0; background: var(--bg); z-index: 1; }
  .scroll { margin-right: -16px; padding-right: 16px; }
  nav a.brand { flex-basis: 100%; font-size: 15px; margin: 0; }
  nav { gap: 8px 16px; }
  #home { padding-top: 16px; }
  #home .hero { margin-bottom: 44px; }
  #home h1 { font-size: 30px; line-height: 1.12; margin-bottom: 14px; }
  #home .lede { font-size: 15px; margin-bottom: 24px; }
  #home .search input { font-size: 17px; padding: 11px 0; }
  #home section { margin-bottom: 48px; }
  .covers { display: flex; overflow-x: auto; gap: 14px; margin-right: -16px; padding-right: 16px; padding-bottom: 4px; }
  .covers a { flex: 0 0 112px; }
  .covers .dist { height: 5px; }
  .lists { gap: 40px; }
  .cta { padding-top: 24px; }
  #home .cta h2.big { font-size: 20px; }
  .cta p { font-size: 14px; }
  .cta a.btn { flex: 1 1 100%; min-height: 48px; }
  .pager { justify-content: center; }
  .pager .range { flex-basis: 100%; text-align: center; }
  .pager .pages { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); flex-wrap: nowrap; }
  .pager .pages .num, .pager .pages .gap, .pager .per { display: none; }
  .pager .mpage { display: flex; }
  .pager .prev { justify-self: start; min-height: 48px; padding: 0; }
  .pager .next { justify-self: end; min-height: 48px; padding: 0; font-weight: 500; }
}

<body>
<nav>
  <a href="#/" class="brand">Book Critic Data</a>
  <a href="#/" data-v="home">Home</a>
  <a href="#/books" data-v="books">Books</a>
  <a href="#/critics" data-v="critics">Critics</a>
  <a href="#/authors" data-v="authors">Authors</a>
  <a href="#/outlets" data-v="outlets">Outlets</a>
  <a href="#/shelf" data-v="shelf">Shelf</a>
  <span class="n" id="count"></span>
</nav>
<div id="head"></div>
<aside id="book-cover" aria-label="Book cover" hidden></aside>
<dialog id="cover-dialog" aria-label="Larger book cover; click or press Escape to close" tabindex="-1">
  <img alt="" referrerpolicy="no-referrer">
</dialog>
<div id="controls">
  <div class="bar">
    <input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
    <select id="g" class="bk"><option value="">All genres</option></select>
    <select id="p" class="bk"><option value="">All publishers</option></select>
    <select id="y" class="bk"><option value="">All years</option></select>
    <label>min reviews <input id="min" type="number" min="1" inputmode="numeric"></label>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div id="out"><p class="empty">Loading…</p></div>
<div id="below"></div>

<script>
const LABEL = ['', 'pan', 'mixed', 'positive', 'rave'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f2 = x => x == null || isNaN(x) ? '' : x.toFixed(2);
const sgn = x => x == null || isNaN(x) ? '' : (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(2);
const int = x => x.toLocaleString('en-US');
const enc = encodeURIComponent;
const fold = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[.'\u2019]/g, '');

// genre menu groups, matching the taxonomy in backfill/genres.py
const GENRE_GROUPS = [
  ['Form', ['Fiction', 'Nonfiction', 'Poetry', 'Drama']],
  ['Fiction', ['Literary Fiction', 'Historical Fiction', 'Mystery & Thriller', 'Science Fiction & Fantasy', 'Horror', 'Romance', 'Short Stories', 'Graphic Novels & Comics', "Children's & Young Adult"]],
  ['Nonfiction', ['Biography & Memoir', 'History', 'Politics & Current Affairs', 'Society & Culture', 'Science & Nature', 'Technology', 'Business & Economics', 'Health & Psychology', 'Philosophy & Religion', 'Arts & Entertainment', 'Essays & Criticism', 'True Crime & Investigative', 'Food & Cooking', 'Travel', 'Sports']],
  ['Attributes', ['In Translation', 'LGBTQ+']],
];
const TIP = {
  adj: 'Mean pulled toward the overall mean (3.27) as if the book had 10 extra average reviews, so books with few reviews do not dominate',
  vs: 'Average gap between this rating and the mean of the other reviews of the same book (books with 4+ reviews; shown at 20+)',
  loo: 'Mean of the other reviews of this book',
  overall: 'Overall verdict across the reviews, as published with them',
  adjA: 'Mean of all reviews of the author’s books, pulled toward the overall mean (3.27) as if they had 10 extra average reviews',
};

const baseAuthor = s => String(s || '').replace(/,?\s*(?:\(|;)?\s*\b(?:trans(?:lated)?\.?|tr\.?|ed(?:ited)?\.?|illus(?:trated)?\.?|intro(?:duction|duced)?\.?)\s+(?:by\b)?.*$/i, '').replace(/[\s,;]+$/, '').trim();
let B = [], C = [], O = [], A = [], R = [], bySlug = {}, cByName = {}, oByName = {}, shards = 128;
const cache = {};

function shardOf(slug) { let h = 0; for (const ch of slug) h = (Math.imul(h, 31) + ch.codePointAt(0)) >>> 0; return h % shards; }
async function detail(slug) {
  const k = shardOf(slug);
  cache[k] ??= fetch(`data/reviews/${k}.json`).then(r => {
    if (!r.ok) throw new Error('Book details unavailable');
    return r.json();
  }).catch(error => { delete cache[k]; throw error; });
  return (await cache[k])[slug] || { d: '', r: [] };
}

// ---- aggregates, recomputed when the source filter changes ----
// src: '' all reviews, 'bm' Book Marks only, 'bf' backfill only (Complete Review grades and model-predicted ratings)
let CA = [], OA = [], RA = [], aggSrc = null;
function aggregate(src) {
  if (src === aggSrc) return;
  aggSrc = src;
  const keep = r => !src || (src === 'bm' ? r.src === 0 : r.src > 0);
  for (const b of B) { b.dist = [0, 0, 0, 0]; b.sum = 0; b.cnt = 0; }
  const ent = (name, i) => ({ i, name, n: 0, sum: 0, dev: 0, dn: 0, dist: [0, 0, 0, 0], set: new Set(), hay: fold(name) });
  C = CA.map(ent); O = OA.map(ent); cByName = {}; oByName = {};
  R = RA.filter(keep).map(r => ({ b: r.b, v: r.v, c: C[r.ci], o: O[r.oi], src: r.src }));
  // v 0 = review without a rating: counted in Reviews, left out of the rating counts and means
  for (const r of R) { r.b.all = (r.b.all || 0) + 1; if (r.v) { r.b.sum += r.v; r.b.cnt++; r.b.dist[4 - r.v]++; } }
  for (const b of B) { b.n = b.all || 0; b.all = 0; b.mean = b.cnt ? b.sum / b.cnt : null; b.adj = b.cnt ? (b.sum + 10 * 3.27) / (b.cnt + 10) : null; }
  for (const r of R) {
    r.loo = r.v && r.b.cnt > 1 ? (r.b.sum - r.v) / (r.b.cnt - 1) : r.v ? null : (r.b.cnt ? r.b.sum / r.b.cnt : null);
    for (const [e, other] of [[r.c, r.o], [r.o, r.c]]) {
      if (!e) continue;
      e.n++; if (other) e.set.add(other.i);
      if (!r.v) continue;
      e.rn = (e.rn || 0) + 1; e.sum += r.v; e.dist[4 - r.v]++;
      if (r.b.cnt >= 4) { e.dev += r.v - r.loo; e.dn++; }
    }
  }
  for (const e of [...C, ...O]) { e.mean = e.rn ? e.sum / e.rn : null; e.vs = e.dn >= 20 ? e.dev / e.dn : null; e.links = e.set.size; }
  C = C.filter(c => c.n); O = O.filter(o => o.n);
  C.forEach(c => cByName[c.name] = c); O.forEach(o => oByName[o.name] = o);
  const am = {};
  for (const b of B) {
    if (!b.aut || !b.n) continue;
    const a = am[b.aut] ??= { name: b.aut, books: 0, n: 0, sum: 0, dist: [0, 0, 0, 0], hay: fold(b.aut) };
    a.books++; a.n += b.n; a.rn = (a.rn || 0) + b.cnt; a.sum += b.sum; b.dist.forEach((x, j) => a.dist[j] += x);
  }
  A = Object.values(am).filter(a => a.n);
  for (const a of A) { a.mean = a.rn ? a.sum / a.rn : null; a.adj = a.rn ? (a.sum + 10 * 3.27) / (a.rn + 10) : null; }
}

let ready = false;
async function load() {
  // the home page paints from the small home.json while the full data loads behind it
  if (parse().view === 'home') { frame('home'); V.home(); }
  const [books, idx] = await Promise.all(['books', 'index'].map(f => fetch(`data/${f}.json`).then(r => r.json())));
  shards = idx.shards;
  B = books.map(([slug, title, author, pub, date, genres, dist, mean, adj, isbn, overall, bf, added]) => ({
    slug, title, author, pub, date, year: date ? +date.slice(0, 4) : null, genres, overall, bf: !!bf, added: added || '',
    ov: { rave: 4, positive: 3, mixed: 2, pan: 1 }[overall] ?? null,
    hay: fold([title, author, pub, isbn].join(' ')),
  }));
  B.forEach(b => { bySlug[b.slug] = b; b.aut = baseAuthor(b.author); });
  CA = idx.critics; OA = idx.outlets;
  RA = idx.reviews.map(([b, v, c, o, src]) => ({ b: B[b], v, ci: c, oi: o, src: src || 0 }));
  aggregate(new URLSearchParams(location.hash.split('?')[1] || '').get('src') || '');
  const gc = {}; B.forEach(b => b.genres.forEach(g => gc[g] = (gc[g] || 0) + 1));
  const opt = g => `<option value="${esc(g)}">${esc(g)} (${int(gc[g])})</option>`;
  const grouped = new Set(GENRE_GROUPS.flatMap(([, gs]) => gs));
  const other = Object.keys(gc).filter(g => !grouped.has(g)).sort();
  $('#g').insertAdjacentHTML('beforeend', [...GENRE_GROUPS, ['Other', other]].map(([label, gs]) => {
    const present = gs.filter(g => gc[g]);
    return present.length ? `<optgroup label="${esc(label)}">${present.map(opt).join('')}</optgroup>` : '';
  }).join(''));
  const pc = {}; B.forEach(b => b.pub && (pc[b.pub] = (pc[b.pub] || 0) + 1));
  const sortName = s => s.replace(/^the\s+/i, '');
  $('#p').insertAdjacentHTML('beforeend', Object.keys(pc).filter(p => pc[p] >= 5).sort((a, b) => sortName(a).localeCompare(sortName(b)))
    .map(p => `<option value="${esc(p)}">${esc(p)} (${int(pc[p])})</option>`).join(''));
  const years = [...new Set(B.map(b => b.year).filter(Boolean))].sort((a, b) => b - a);
  $('#y').insertAdjacentHTML('beforeend', years.map(y => `<option>${y}</option>`).join(''));
  ready = true;

// ---- state lives in the URL: #/view/arg?q=&g=&y=&a=&p=&s=&d=&min= ----
let S = {};
function parse() {
  const [path, qs = ''] = location.hash.slice(1).split('?');
  const [, view = 'home', ...rest] = path.split('/');
  const p = new URLSearchParams(qs);
  return { view: V[view] ? view : 'home', arg: rest.length ? decodeURIComponent(rest.join('/')) : '', p };
}
function href(view, arg = '', params = {}) {
  const p = new URLSearchParams(Object.entries(params).filter(([, v]) => v !== '' && v != null));
  return `#/${view}${arg ? '/' + enc(arg) : ''}${[...p].length ? '?' + p : ''}`;
}
function sync() {
  const t = T || {};
  const params = { q: S.q, g: S.g, y: S.y, a: S.a, p: S.p, src: S.src, min: S.min != t.defMin ? S.min : '', s: t.sort !== t.defSort ? t.sort : '', d: t.dir !== t.defDir ? t.dir : '',
    per: t.per && t.per !== PER[0] ? t.per : '', pg: t.page > 1 ? t.page : '' };
  history.replaceState(null, '', href(S.view, S.arg, params));
}

// ---- table ----
// One page of rows at a time. The page and page size live in the URL (pg, per) with the filters, so the back
// button and shared links return to the same page. Sorts listed in def.extra have no column of their own.
const PER = [50, 100, 250];
let T = null;
function table(cols, rows, def) {
  const p = S.params, extra = def.extra || {};
  const want = p.get('s');
  const sort = want && (cols.some(c => c.k === want) || extra[want]) ? want : def.sort;
  const col = cols.find(c => c.k === sort);
  T = { cols, rows, extra, noun: def.noun, name: def.name, empty: def.empty, sort, defSort: def.sort, defDir: -1, defMin: def.min,
        dir: p.get('d') ? +p.get('d') : (sort === def.sort || !col ? -1 : col.num ? -1 : 1),
        per: PER.includes(+p.get('per')) ? +p.get('per') : PER[0], page: Math.max(1, parseInt(p.get('pg'), 10) || 1) };
  S.min = p.get('min') || def.min;
  $('#min').value = S.min;
  draw(false);
}
function filtered() {
  const terms = fold(S.q).split(/\s+/).filter(Boolean);
  const min = +S.min || 1, y = +S.y || 0;
  const col = T.cols.find(c => c.k === T.sort);
  const rows = T.rows.filter(r => (r.n ?? 99) >= min
    && (!S.g || r.genres?.includes(S.g)) && (!y || r.year === y)
    && (!S.a || r.aut === S.a) && (!S.p || r.pub === S.p)
    && terms.every(t => r.hay.includes(t)));
  const get = col ? col.v || (r => r[col.k]) : T.extra[T.sort].v;
  rows.sort((a, b) => {
    const x = get(a), z = get(b);
    if (x == null || x === '') return 1; if (z == null || z === '') return -1;
    return (typeof x === 'string' ? x.localeCompare(z) : x - z) * T.dir;
  });
  return rows;
}
// draw() refilters and resorts, returning to page 1 unless told to keep the page from the URL
function draw(reset = true) {
  T.view = filtered();
  if (reset) T.page = 1;
  T.pages = Math.max(1, Math.ceil(T.view.length / T.per));
  T.page = Math.min(T.page, T.pages);
  const h = T.cols.map(c => `<th class="${c.num ? 'r ' : ''}${c.cls || ''}${c.k === T.sort ? ' on' : ''}" data-k="${c.k}"${c.tip ? ` title="${esc(c.tip)}"` : ''}>${c.label}${c.k === T.sort ? (T.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('');
  $('#out').innerHTML = T.view.length
    ? `<div class="status"></div><div class="scroll"><table><thead><tr>${h}</tr></thead><tbody></tbody></table></div><nav class="pager" aria-label="Pages"></nav>`
    : `<p class="empty">${T.empty ? T.empty() : 'No matches'}</p>`;
  const reviewCount = T.noun === 'reviews' ? '' : ' · ' + int(T.view.reduce((sum, row) => sum + row.n, 0)) + ' reviews';
  $('#count').textContent = int(T.view.length) + ' ' + T.noun + reviewCount;
  chips(); paint();
}
// paint() renders the current page into the table drawn above
function paint() {
  sync();
  const tb = $('#out tbody'); if (!tb) return;
  const start = (T.page - 1) * T.per, end = Math.min(start + T.per, T.view.length);
  tb.innerHTML = T.view.slice(start, end).map(r =>
    `<tr>${T.cols.map(c => `<td class="${c.num ? 'r ' : ''}${c.cls || ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('');
  const range = `Showing <b>${int(start + 1)}–${int(end)}</b> of ${int(T.view.length)} ${T.noun}`;
  $('#out .status').innerHTML = `<span>${range}</span>${T.pages > 1 ? `<span>Page ${int(T.page)} of ${int(T.pages)}</span>` : ''}`;
  $('#out .pager').innerHTML = pager(range);
}
function pager(range) {
  const { page, pages } = T;
  let nums = '', last = 0;
  if (pages > 1) {
    const show = new Set([1, pages]);
    for (let i = page - 2; i <= page + 2; i++) if (i >= 1 && i <= pages) show.add(i);
    for (const n of [...show].sort((a, b) => a - b)) {
      if (n - last > 1) nums += '<span class="gap">…</span>';
      nums += n === page ? `<button type="button" class="num cur" aria-current="page">${int(n)}</button>`
        : `<button type="button" class="num" data-pg="${n}" aria-label="Page ${n}">${int(n)}</button>`;
      last = n;
    }
  }
  const pages_ = pages > 1 ? `<span class="pages">`
    + `<button type="button" class="prev" data-pg="${page - 1}"${page === 1 ? ' disabled' : ''}>← Previous</button>${nums}`
    + `<label class="mpage">Page <input type="number" inputmode="numeric" min="1" max="${pages}" value="${page}" aria-label="Page number" data-pgin> of ${int(pages)}</label>`
    + `<button type="button" class="next" data-pg="${page + 1}"${page === pages ? ' disabled' : ''}>Next →</button></span>` : '';
  const per = T.view.length > PER[0]
    ? `<label class="per">Rows per page<select data-per>${PER.map(n => `<option${n === T.per ? ' selected' : ''}>${n}</option>`).join('')}</select></label>` : '';
  return `<span class="range">${range}</span>${pages_}${per}`;
}
function go(n) {
  T.page = Math.min(Math.max(1, n || 1), T.pages);
  paint();
  const top = $('#out').getBoundingClientRect().top + scrollY - 16;
  if (scrollY > top) window.scrollTo(0, top);
}
function chips() {
  const set = [['a', 'Author']].filter(([k]) => S[k]);
  const ex = T.extra[T.sort];
  $('#chips').innerHTML = set.map(([k, l]) => `<a href="#" data-clear="${k}">${l}: <b>${esc(S[k])}</b> ×</a>`).join('')
    + (ex ? `<a href="#" data-clear="sort">Sorted by <b>${esc(ex.label)}</b> ×</a>` : '');
  if (S.p && ![...$('#p').options].some(o => o.value === S.p)) $('#p').add(new Option(S.p, S.p));
  for (const k of ['g', 'p', 'y']) { $('#' + k).value = S[k]; $('#' + k).classList.toggle('set', !!S[k]); }
}

$('#out').addEventListener('click', e => {

// spread: standard deviation of a book's ratings on the 1–4 scale, the measure behind "most divisive"
function spread(d) {
  const n = d[0] + d[1] + d[2] + d[3]; if (n < 2) return 0;
  const m = (4 * d[0] + 3 * d[1] + 2 * d[2] + d[3]) / n;
  return Math.sqrt(d.reduce((s, c, j) => s + c * (4 - j - m) ** 2, 0) / n);
}

// live search on the home page across books, authors, critics and outlets
function hits() {
  const box = $('#hits'), input = $('#home-q');
  if (!box || !input) return;
  const q = input.value.trim();
  if (!q) return box.innerHTML = '';
  if (!ready) return box.innerHTML = '<p class="empty">Loading the index…</p>';
  const terms = fold(q).split(/\s+/).filter(Boolean);
  const top = (rows, k) => rows.filter(x => x.n && terms.every(t => x.hay.includes(t))).sort((a, b) => b.n - a.n).slice(0, k);
  const groups = [
    ['Books', top(B, 6), b => [`#/book/${enc(b.slug)}`, `${esc(b.title)} <span>${esc(baseAuthor(b.author))}</span>`, b.slug]],
    ['Authors', top(A, 3), a => [href('books', '', { a: a.name }), `${esc(a.name)} <span>${plural(a.books, 'book')}</span>`]],
    ['Critics', top(C, 3), c => ['#/critic/' + enc(c.name), `${esc(c.name)} <span>${plural(c.n, 'review')}</span>`]],
    ['Outlets', top(O, 3), o => ['#/outlet/' + enc(o.name), `${esc(o.name)} <span>${plural(o.n, 'review')}</span>`]],
  ].filter(([, rows]) => rows.length);
  const all = href('books', '', { q });
  box.innerHTML = groups.length
    ? groups.map(([label, rows, f]) => `<div class="grp">${label}</div>` + rows.map(x => { const [link, html, slug] = f(x);
      return `<a href="${link}"${slug ? ` data-book-preview="${esc(slug)}"` : ''}>${html}</a>`; }).join('')).join('')
      + `<a href="${all}">All matching books →<span></span></a>`
    : `<p class="empty">No matches. <a href="${all}">Search all books</a></p>`;
}

function person(e, kind) {
  if (!e) return head('<h1>Not found</h1>');
  const isC = kind === 'critic';
  const rows = R.filter(r => (isC ? r.c : r.o) === e).map(r => {
    const other = isC ? r.o : r.c;
    return { ...r.b, b: r.b, v: r.v, loo: r.loo, diff: r.loo == null || !r.v ? null : r.v - r.loo, other, hay: r.b.hay + ' ' + (other?.hay || '') };
  });
  head(`<h1>${esc(e.name)}</h1><div class="meta">${int(e.n)} reviews · ${int(e.links)} ${isC ? 'outlets' : 'critics'} · ${distTxt(e.dist)} · mean ${f2(e.mean)}${e.vs != null ? ' · ' + sgn(e.vs) + ' vs. other reviewers of the same books' : ''}</div>`);
  table([
    { k: 'title', label: 'Book', f: r => titleCell(r.b) },
    { k: 'author', label: 'Author', cls: 'desk', f: r => r.author ? `<span class="f" data-fk="a" data-fv="${esc(r.aut)}" title="Show only ${esc(r.aut)}">${esc(r.author)}</span>` : '' },
    { k: 'date', label: 'Date', cls: 'nw', f: dateCell },
    { k: 'v', label: 'Rating', num: 1, v: r => r.v || null, f: r => LABEL[r.v] || '<span class="d">unrated</span>' },
    { k: 'loo', label: 'Others’ mean', num: 1, tip: TIP.loo, f: r => f2(r.loo) },
    { k: 'diff', label: 'Diff', num: 1, f: r => sgn(r.diff) },
    { k: 'other', label: isC ? 'Outlet' : 'Critic', cls: 'nw', v: r => r.other?.name ?? '', f: r => isC ? oLink(r.other) : cLink(r.other) },
  ], rows, { sort: 'date', noun: 'reviews', min: 1, name: e.name });
}

function head(html) { $('#head').innerHTML = html; }

const coverDialog = $('#cover-dialog');
coverDialog.addEventListener('click', () => coverDialog.close());
coverDialog.addEventListener('close', () => document.documentElement.classList.remove('cover-open'));

function showBookCover(book, value) {
  const cover = $('#book-cover');
  let url;
  try { url = new URL(value); } catch { return; }
  if (url.protocol !== 'https:') return;
  const img = new Image();
  img.alt = `Cover of ${book.title}`;
  img.referrerPolicy = 'no-referrer';
  img.addEventListener('load', () => {
    if (S.view === 'book' && S.arg === book.slug) {
      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('aria-label', `Enlarge cover of ${book.title}`);
      button.append(img);
      button.addEventListener('click', () => {
        const enlarged = coverDialog.querySelector('img');
        enlarged.src = img.src;
        enlarged.alt = img.alt;
        coverDialog.showModal();
        document.documentElement.classList.add('cover-open');
      });
      cover.replaceChildren(button);
      cover.hidden = false;
    }
  });
  img.src = url.href;
}

function route() {
  if (coverDialog.open) coverDialog.close();
  if (!ready) { // until the data arrives only the home page can draw; load() routes again when it is in
    const v = parse().view;
    frame(v);
    if (v === 'home') V.home(); else { head(''); $('#out').innerHTML = '<p class="empty">Loading…</p>'; }
    return;
  }
  const { view, arg, p } = parse();
  S = { view, arg, params: p, q: p.get('q') || '', g: p.get('g') || '', y: p.get('y') || '', a: p.get('a') || '', p: p.get('p') || '', src: p.get('src') || '' };
  aggregate(S.src);
  $('#q').value = S.q;
  $('#q').placeholder = view === 'shelf' ? 'Search your books' : 'Search';
  T = null;
  frame(view);
  V[view](arg);
}
// page furniture that depends only on the view
function frame(view) {
  const listy = !['book', 'home'].includes(view);
  document.body.classList.toggle('book-page', view === 'book');
  $('#book-cover').hidden = true;
  $('#book-cover').replaceChildren();
  $('#below').innerHTML = '';
  $('#chips').innerHTML = '';
  $('#controls').style.display = listy ? '' : 'none';
  document.querySelectorAll('.bk').forEach(el => el.style.display = ['critics', 'outlets', 'authors'].includes(view) ? 'none' : '');
  if (!listy) $('#count').textContent = '';
  if (['home', 'books', 'critics', 'outlets', 'authors'].includes(view)) head('');
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.v === view));
}
let lastPath = '';
addEventListener('hashchange', () => {
  const path = location.hash.split('?')[0];
  route();
  if (path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
});
load();
</script>
<script src="shelf.js"></script>
<script src="preview.js"></script>
